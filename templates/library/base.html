<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Drishti Library{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="d-flex">
  <aside class="sidebar p-3">
    <a class="brand" href="{% url 'dashboard' %}">DRISHTI <span>LIBRARY</span></a>
    <p class="small text-white-50 mt-1">Management System</p>
    <nav class="nav flex-column mt-4 gap-1">
      <a href="{% url 'dashboard' %}" class="nav-link">⌂ Dashboard</a>
      <a href="{% url 'student_list' %}" class="nav-link">♙ Students</a>
      <a href="{% url 'student_create' %}" class="nav-link">＋ New Admission</a>
      <a href="{% url 'seat_list' %}" class="nav-link">▦ 40 Seats</a>
      <a href="{% url 'payment_list' %}" class="nav-link">₹ Payments</a>
      <a href="{% url 'reports' %}" class="nav-link">▤ Reports</a>
      <a href="/admin/" class="nav-link mt-3">⚙ Admin Panel</a>
    </nav>
  </aside>
  <main class="content flex-grow-1 p-4 p-lg-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 mb-0">{% block heading %}Dashboard{% endblock %}</h1>
        <span class="text-muted">Drishti Library Management</span>
      </div>
      <a href="{% url 'student_create' %}" class="btn btn-primary">+ Admission</a>
    </div>
    {% for message in messages %}
    <div class="alert alert-success alert-dismissible fade show" role="alert">{{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
